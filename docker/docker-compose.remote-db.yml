version: '3.8'

# InStock Docker Compose - 远程数据库版本
# 使用此配置连接外部MySQL数据库（不启动本地数据库容器）

services:
  instock:
    build:
      context: .
      dockerfile: Dockerfile
    image: instock:latest
    container_name: instock-app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9988}:9988"
      - "${SUPERVISOR_PORT:-9001}:9001"
    environment:
      # 远程数据库配置
      db_host: ${REMOTE_DB_HOST:-115.29.213.22}
      db_port: ${REMOTE_DB_PORT:-3306}
      db_user: ${REMOTE_DB_USER:-root}
      db_password: ${REMOTE_DB_PASSWORD:-Dzm@ming&662}
      db_database: ${REMOTE_DB_DATABASE:-instockdb}
      # 数据源配置
      DATA_SOURCE_MAX_RETRIES: ${DATA_SOURCE_MAX_RETRIES:-2}
      DATA_SOURCE_RETRY_INTERVAL: ${DATA_SOURCE_RETRY_INTERVAL:-30}
      # 历史数据配置
      HIST_DATA_DEFAULT_YEARS: ${HIST_DATA_DEFAULT_YEARS:-3}
      HIST_DATA_CACHE_EXPIRE_DAYS: ${HIST_DATA_CACHE_EXPIRE_DAYS:-30}
    volumes:
      # 代理配置文件（可选）
      - ./config/proxy.txt:/data/InStock/instock/config/proxy.txt:ro
      # 日志目录
      - instock_logs:/data/InStock/instock/log
      # 缓存目录
      - instock_cache:/data/InStock/instock/cache
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9988/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  instock_logs:
    driver: local
  instock_cache:
    driver: local
