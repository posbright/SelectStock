# InStock Docker Compose 配置
# 用法: docker-compose up -d

services:
  # MySQL数据库服务
  instockdb:
    image: mysql:8.0
    container_name: instock-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-instockdb}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    volumes:
      - instock_db_data:/var/lib/mysql
    networks:
      - instock_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # InStock主服务
  instock:
    build:
      context: .
      dockerfile: Dockerfile
    image: instock:latest
    container_name: instock-app
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-9988}:9988"
      - "${SUPERVISOR_PORT:-9001}:9001"
    environment:
      # 数据库配置
      db_host: instockdb
      db_port: 3306
      db_user: root
      db_password: ${DB_PASSWORD:-root}
      db_database: ${DB_DATABASE:-instockdb}
      # 数据源配置
      DATA_SOURCE_MAX_RETRIES: ${DATA_SOURCE_MAX_RETRIES:-2}
      DATA_SOURCE_RETRY_INTERVAL: ${DATA_SOURCE_RETRY_INTERVAL:-30}
      # 历史数据配置
      HIST_DATA_DEFAULT_YEARS: ${HIST_DATA_DEFAULT_YEARS:-3}
      HIST_DATA_CACHE_EXPIRE_DAYS: ${HIST_DATA_CACHE_EXPIRE_DAYS:-30}
    volumes:
      # 代理配置文件（可选）
      - ./config/proxy.txt:/data/InStock/instock/config/proxy.txt:ro
      # 日志目录
      - instock_logs:/data/InStock/instock/log
      # 缓存目录
      - instock_cache:/data/InStock/instock/cache
    depends_on:
      instockdb:
        condition: service_healthy
    networks:
      - instock_network
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9988/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

# 数据卷
volumes:
  instock_db_data:
    driver: local
  instock_logs:
    driver: local
  instock_cache:
    driver: local

# 网络
networks:
  instock_network:
    driver: bridge

